#test
name: AWS CDK CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Build and synthesize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Synthesize CloudFormation
        run: npx cdk synth

  deploy:
    name: Deploy to AWS
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      CDK_DEFAULT_REGION: ca-central-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977323999168:role/githubDeploy
          aws-region: ca-central-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Synthesize CDK
        run: npx cdk synth

      - name: Deploy CDK stack
        run: npx cdk deploy CdkProjectAwsDevopsStack --require-approval never
